[build]
target = "i686-averion.json" # тут мы говорим под какую платформу собираем проект 

[unstable]
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]
json-target-spec = true

[target.i686-averion]
linker = "rust-lld"
runner = "powershell -ExecutionPolicy Bypass -File run.ps1"
rustflags = [
    "-Zunstable-options",
    "-C", "link-arg=-Tlinker.ld",
]